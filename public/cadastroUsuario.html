<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuários</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./CSS/styles.css">
</head>
<body>

  <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold fs-3" href="index.html">TaxLife</a>
      
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="index.html">Início</a>
        <a class="nav-link active" href="cadastroUsuario.html">Usuários</a>
        <a class="nav-link" href="cadastroTaxista.html">Taxistas</a>
        <a class="nav-link" href="listagens.html">Listagens</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <h1 class="text-center text-success">👤 Cadastro de Usuários</h1>
    <hr />

    <form class="mt-4" action="http://localhost:3000/api/usuarios" method="POST">
      <div class="mb-3">
        <label for="name" class="form-label">Nome Completo</label>
        <input type="text" class="form-control" id="name" name="Name" placeholder="Digite seu nome" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="Email" placeholder="Digite seu email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Senha</label>
        <input type="password" class="form-control" id="password" name="Senha" placeholder="Digite sua senha" required>
      </div>
      <div class="row">
        <div class="col-12 col-md-6 mb-2 mb-md-0">
          <button type="submit" class="btn btn-success w-100">Cadastrar</button>
        </div>
        <div class="col-12 col-md-6">
          <a href="index.html" class="btn btn-secondary w-100">Voltar</a>
        </div>
      </div>
    </form>
  </div>
</body>
</html>
